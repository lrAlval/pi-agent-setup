# sync-classify.conf - sourced by sync-from-live.sh (bash).
# Classification lists. Patterns are bash globs matched against the path
# relative to the live agent dir (and its basename as fallback).

RUNTIME_PATTERNS=(
  sessions* 'sessions.db*' '*.wal' '*.shm' '*.lock'
  mcp-cache.json mcp-onboarding.json pi-usage.json last-seen-version.json
  '*-pending.json' 'install/*' 'npm/*' 'bin/*'
  'pi-hermes-memory/sessions.db*' 'projects-memory/*' 'node_modules/*' '.git/*' 'yolo-trail/*'
  '.pi-hermes-locks.sqlite*' '*.recovery-*' '.skills-migrated-to-extension-storage'
  'pi-blackhole/*' 'extensions/*/logs/*' 'plans/*' 'skill-audit/*' 'archive/*'
  'pi-eta-active.json' 'pi-eta-history.json' 'pi-hermes-memory/*' 'projects-memory/*'
  'token-trail.jsonl'
)

SECRET_PATTERNS=(
  auth.json trust.json '*secret*' '*credentials*' '*.pem' '*.key'
  '*token*.json' '*api-token*' '*auth-token*' '*access-token*'
)

SKIP_ALWAYS=(
  models-store.json 'git/*'
  'skills/archify/*' 'skills/code-review-orchestrator/*' 'skills/design-orchestrator/*'
  'skills/execute-plan/*' 'skills/map-codebase/*' 'skills/quick-fix/*'
  'skills/security-orchestrator/*' 'skills/seed-conventions/*' 'skills/session-state/*'
  'agents-archive/*' 'extensions-archive/*' '.archify/*' '.codegraph/*' '.pi/*' '.rpiv/*'
  '.billion-context-*' 'missions/*' 'tmp/*' 'logs/*' 'crashes.json'
  'howaboua-pi-stuff-changelog.json' 'codex-usage.json' 'pi-codex-conversion.json'
  'pi-droid-styling.json' 'settings.json.*' 'permission-config.pre-yolo-swap.*.bak' 'backups/permission-swap-*'
  'pi-eta-history.json.imported' 'pi-todo-eta.db'
  AGENTS.md GLOSSARY.md OPINIONS.md caveman.json config.yml efficient-pi-ask-user.json
  spark.json subagents-lite.json 'scripts/*' 'specs/*' 'templates/*' 'themes/*'
  'skills/dotnet-routing/*' 'skills/impl-lanes/*' 'skills/subagent-delegation/*'
  'skills/token-tools/*' 'skills/treehouse-worktrees/*'
  'extensions/efficient-pi-ask-user/*' 'extensions/local-bash/*'
  'extensions/local-patch-guard/*' 'extensions/spine-enforcer/*'
  'extensions/token-trail/*' 'extensions/xias-enforcer/*'
  'patches/*' 'packages/*' 'local-bash.json' pi-plan-mode.json
  'skills/uix/*' 'scripts/__pycache__/*'
)

VENDOR_ALWAYS=(
  'extensions/pi-footer.json'
  'extensions/pi-rtk-optimizer/config.json' 'extensions/todo-eta/*'
  extensions/herdr-agent-state.ts extensions/orca-agent-status.ts
  hide-providers.json settings.json 'agents/*'
  'skills/agent-routing/*' 'skills/slice-tasks/*'
)

SKILL_SOURCES=()

TRANSFORMS=()

# MEMORY_MODE=skip - memory/ excluded by policy (never vendored from live).
MEMORY_MODE=skip
