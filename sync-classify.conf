# sync-classify.conf - sourced by sync-from-live.sh (bash).
# Classification lists. Patterns are bash globs matched against the path
# relative to the live agent dir (and its basename as fallback).

RUNTIME_PATTERNS=(
  sessions* 'sessions.db*' '*.wal' '*.shm' '*.lock'
  mcp-cache.json mcp-onboarding.json pi-usage.json last-seen-version.json
  '*-pending.json' 'install/*' 'npm/*' 'bin/*'
  'pi-hermes-memory/sessions.db*' 'projects-memory/*' 'node_modules/*' '.git/*'
  '.pi-hermes-locks.sqlite*' '*.recovery-*' '.skills-migrated-to-extension-storage'
  'pi-blackhole/*' 'extensions/*/logs/*' 'plans/*' 'skill-audit/*' 'archive/*'
  'logs/*' 'stream-rules.jsonl'
  'pi-eta-active.json' 'pi-eta-history.json' 'pi-hermes-memory/*' 'projects-memory/*'
  'token-trail.jsonl'
)

SECRET_PATTERNS=(
  auth.json trust.json '*secret*' '*credentials*' '*.pem' '*.key'
  '*token*.json' '*api-token*' '*auth-token*' '*access-token*'
)

SKIP_ALWAYS=(
  models-store.json 'git/*'
  '**/__pycache__/*' '*.pyc'
  '.pi/tasks/*' '.codegraph/*'
  # merge-managed: install.sh unions shipped + local entries, so never vendor it
  'patches/patch-registry.json'
  # deliberately live-only: these patch pi-coding-agent core, not an extension
  'patches/fix-pi-core-event-command-context.mjs'
  'patches/verify-pi-core-event-command-context.mjs'
  'patches/fix-pi-core-stale-emit-guard.mjs'
  'patches/verify-pi-core-stale-emit-guard.mjs'
  'skills/archify/*' 'skills/code-review-orchestrator/*' 'skills/design-orchestrator/*'
  'skills/execute-plan/*' 'skills/map-codebase/*' 'skills/quick-fix/*'
  'skills/security-orchestrator/*' 'skills/seed-conventions/*' 'skills/session-state/*'
)

VENDOR_ALWAYS=(
  # every local extension is internal to this setup and ships here; the
  # RUNTIME_PATTERNS entry 'extensions/*/logs/*' still excludes their logs
  'extensions/*'
  'packages/*' AGENTS.md OPINIONS.md caveman.json pi-plan-mode.json
  efficient-pi-ask-user.json local-bash.json hide-providers.json settings.json
  config.yml 'agents/*' 'skills/agent-routing/*' 'scripts/*'
  'spark.json'
  'skills/slice-tasks/*' 'templates/prp-plan.md'
  'themes/*' subagents-lite.json
  'patches/apply-omp-theme-plan-complete.mjs' 'patches/verify-omp-theme-plan-complete.mjs'
  'patches/pi-omp-theme-plan-complete-result.patch' 'patches/patch-registry.schema.json'
)

SKILL_SOURCES=(
  diagnose grilling implement plannotator-setup-goal pr-review setup-matt-pocock-skills
  to-questionnaire wayfinder
)

TRANSFORMS=(
  'settings.json:../../dev/better-plan-mode/packages/pi-plan-mode:packages/better-plan-mode'
  'settings.json:../../dev/([A-Za-z0-9._-]*):packages/\1'
)

# MEMORY_MODE=skip - memory/ excluded by policy (never vendored from live).
MEMORY_MODE=skip
